<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Builder - Connor Hanlin</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Custom styles -->
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="stylesheet" href="../assets/css/api-builder.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navigation -->
    <nav class="navbar navbar-dark navbar-expand-lg fixed-top" id="main-nav">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">CH</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="navbar-nav gap-2">
                    <a class="btn btn-warning nav-btn" href="../index.html#projects">BACK TO PORTFOLIO</a>
                    <div class="btn-group" role="group" aria-label="Page Theme toggle button group">
                        <input type="radio" class="btn-check" name="btnradio" id="LightTheme" autocomplete="off">
                        <label class="btn btn-outline-warning theme-toggle-btn" for="LightTheme">
                            <svg class="bi" width="1em" height="1em">
                                <use href="#sun-fill"></use>
                            </svg>
                        </label>

                        <input type="radio" class="btn-check" name="btnradio" id="DarkTheme" autocomplete="off" checked>
                        <label class="btn btn-outline-warning theme-toggle-btn" for="DarkTheme">
                            <svg class="bi" width="1em" height="1em">
                                <use href="#moon-stars-fill"></use>
                            </svg>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        <div class="container-fluid h-100">
            <div class="row h-100">
                <!-- Sidebar -->
                <aside id="sidebar" class="col-lg-3 col-xl-2 p-0 border-end border-secondary">
                    <div class="sidebar-header d-flex justify-content-between align-items-center p-3 border-bottom border-secondary">
                        <h6 class="mb-0 text-warning fw-bold text-uppercase">Collections</h6>
                        <button class="btn btn-sm btn-warning" id="btn-new-folder" title="New Folder">+ Folder</button>
                    </div>
                    <div id="folder-tree" class="sidebar-body overflow-auto p-2">
                        <!-- Folder tree rendered by JS -->
                    </div>
                </aside>

                <!-- Main content area (placeholder for future steps) -->
                <div class="col-lg-9 col-xl-10 p-4">
                    <div id="empty-state" class="d-flex flex-column align-items-center justify-content-center h-100 text-muted">
                        <h4 class="mb-2">API Request Builder</h4>
                        <p>Create a folder and add requests to get started.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create Folder Modal -->
    <div class="modal fade" id="createFolderModal" tabindex="-1" aria-labelledby="createFolderModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-warning">
                <div class="modal-header border-warning">
                    <h5 class="modal-title" id="createFolderModalLabel">New Folder</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control" id="folder-name-input" placeholder="Folder name" maxlength="50">
                </div>
                <div class="modal-footer border-warning">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning btn-sm" id="btn-confirm-folder">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Request Modal -->
    <div class="modal fade" id="createRequestModal" tabindex="-1" aria-labelledby="createRequestModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-warning">
                <div class="modal-header border-warning">
                    <h5 class="modal-title" id="createRequestModalLabel">New Request</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control mb-3" id="request-name-input" placeholder="Request name" maxlength="50">
                    <select class="form-select" id="request-method-input">
                        <option value="GET" selected>GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                    </select>
                </div>
                <div class="modal-footer border-warning">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning btn-sm" id="btn-confirm-request">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-section text-center py-4 mt-auto border-top border-secondary">
        <p class="mb-0">&copy; 2026 Connor Hanlin. All Rights Reserved</p>
    </footer>

    <!-- SVG Icons for theme switcher (hidden from view) -->
    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">

        </symbol>
        <symbol id="moon-stars-fill" viewBox="0 0 16 16">
            <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.367 2.052 1.534 4.822.525a.773.773 0 0 1 1.178.278z"/>
            <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.156 1.156 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.156 1.156 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732L13.863.1z"/>
        </symbol>
    </svg>

    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/api-storage.js"></script>
    <script src="../assets/js/api-builder.js"></script>
</body>
</html>
